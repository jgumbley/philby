bind-key -n C-c if-shell -F '#{||:#{==:#{pane_id},#{@philby_agent}},#{==:#{pane_id},#{@philby_view}}}' {
  run-shell -C 'display-popup -EE -B -w 100% -h 100% #{@philby_close_view} #{@philby_frame} #{pane_id} #{?@philby_agent,frame,pane} #{?@philby_agent,#{@philby_frame},#{@philby_pane}}'
} {
  send-keys C-c
}
