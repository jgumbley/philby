set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -g set-titles on
set -g set-titles-string '#T'
set -g allow-rename off
setw -g automatic-rename off
set -g remain-on-exit failed
set -g status-position bottom
set -g status-style bg=#1E1E1E,fg=#4FC1FF
set -g status-left-length 4
set -g status-right-length 0
set -g status-left '#[fg=#4FC1FF]📡'
set -g status-right ''
setw -g window-status-format '#[fg=#888] #I:#W '
setw -g window-status-current-format '#[fg=#4FC1FF,bold] #I:#W '
set -g message-style fg=#1E1E1E,bg=#9CDCFE,bold
set -g pane-border-status off
set -g pane-border-style fg=#333333
set -g pane-active-border-style fg=#484E50
bind-key | new-window -c '#{pane_current_path}'
bind-key - new-window -c '#{pane_current_path}'
bind-key C-t new-window -c '#{pane_current_path}'
bind-key -n C-End if-shell -F '#{==:#{window_index},#{session_windows}}' 'run-shell -b "#{@philby_new_window}"' 'next-window'
bind-key -n C-Home previous-window
bind-key -n C-DC kill-window
